name: quran_pro
description: Islamic learning and worship app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, DI, routing
  get: 4.7.3

  # Firebase
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  firebase_storage: 14.0.1
  firebase_messaging: 17.0.1
  firebase_crashlytics: 6.0.1
  firebase_analytics: 13.0.1
  firebase_remote_config: 7.0.1
  firebase_app_check: 0.5.1
  google_sign_in: 7.2.0

  # Worship features
  adhan: 2.0.0+1
  geolocator: 14.1.2
  just_audio: 0.10.6

  # Notifications
  flutter_local_notifications: 23.0.1
  timezone: 0.11.2
  flutter_timezone: 5.1.1

  # Storage, network, utils
  get_storage: 2.1.1
  flutter_secure_storage: 11.2.0
  connectivity_plus: 7.3.1
  equatable: 3.0.0
  logger: 2.8.0
  intl: any # flutter_localizations dictates the version; the exact one is locked in pubspec.lock

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  # `flutter run` / IDE launches without --flavor build the dev flavor.
  default-flavor: dev
  config:
    # Firebase iOS SDK stopped publishing to CocoaPods (FirebaseAppCheck 12.19.3 is SPM-only).
    enable-swift-package-manager: true
  assets:
    - assets/data/    # quran.json, duas.json, names_of_allah.json (offline core content)
    - assets/audio/   # in-app azan preview
  fonts:
    - family: Amiri
      fonts: [{ asset: assets/fonts/Amiri-Regular.ttf }]
    - family: NotoNastaliqUrdu
      fonts: [{ asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf }]
    - family: Manrope
      fonts:
        - { asset: assets/fonts/Manrope-400.ttf, weight: 400 }
        - { asset: assets/fonts/Manrope-600.ttf, weight: 600 }
        - { asset: assets/fonts/Manrope-700.ttf, weight: 700 }
        - { asset: assets/fonts/Manrope-800.ttf, weight: 800 }
    - family: JetBrainsMono
      fonts: [{ asset: assets/fonts/JetBrainsMono-700.ttf, weight: 700 }]
